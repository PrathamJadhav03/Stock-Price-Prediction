data:
  symbol: "GOOGL"
  data_dir: "data/processed"
  models_dir: "models"
  target_col: "log_return"
  price_col: "Close"
  seq_length: 30
  batch_size: 64
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

model:
  input_dim: 23
  hidden_dim: 64
  num_layers: 2
  dropout: 0.2
  use_layer_norm: true
  mc_samples: 50
  confidence_level: 0.95

training:
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 100
  patience: 10
  min_delta: 0.0001
  lr_factor: 0.5
  lr_patience: 5
  max_grad_norm: 1.0
  seed: 42
  device: "auto" # "cuda", "cpu", or "auto"
